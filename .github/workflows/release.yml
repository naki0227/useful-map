name: リリース（App Store）

# タグを押したときだけ Apple へ流す。main への push では動かさない。
# バージョンはタグから取る（v1.2.3 → 1.2.3）。ビルド番号は実行回数を使うので、
# 同じバージョンで何度でも上げ直せる。
on:
  push:
    tags: ['v*']
  # 手で流したいとき用。dry_run を true にすると Apple へは送らない。
  workflow_dispatch:
    inputs:
      dry_run:
        description: Apple へ送らず、書き出しまでで止める
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: アーカイブ → 提出
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/select-toolchain
      - run: brew install xcodegen

      - name: バージョンを決める
        id: version
        run: |
          set -euo pipefail
          if [ "${{ github.ref_type }}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version=$(grep 'MARKETING_VERSION' project.yml | head -1 | tr -d ' "' | cut -d: -f2)
          fi
          echo "marketing=$version" >> "$GITHUB_OUTPUT"
          # 実行回数をそのままビルド番号にする。単調増加で、重複しない。
          echo "build=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "バージョン $version (build ${{ github.run_number }})"

      # 署名まわり。
      #
      # クラウド署名（秘密鍵を Apple 側に置く方式）は CI から使うと
      # 「Cloud signing permission error」になるため、配布用証明書を
      # こちらで作って持ち込む。秘密鍵はローカルで生成したもので、
      # Apple へ送ったのは CSR だけ（scripts/make-distribution-cert.sh）。
      #
      # 証明書はこの実行だけの一時キーチェーンへ入れる。ランナーは使い捨てだが、
      # 既定のキーチェーンを汚さないほうが失敗時に切り分けやすい。
      - name: 署名の準備
        env:
          DIST_CERT_P12: ${{ secrets.DIST_CERT_P12 }}
          DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/build.keychain-db"
          password=$(uuidgen)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"

          echo "$DIST_CERT_P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$keychain" \
            -P "$DIST_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security -A
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$password" "$keychain" >/dev/null
          # 既定のキーチェーンにも並べる。xcodebuild は検索パスから証明書を探す。
          security list-keychains -d user -s "$keychain" \
            $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/dist.p12"
          security find-identity -v -p codesigning "$keychain"

          # プロファイルの取得と提出に使う API キー。
          mkdir -p "$RUNNER_TEMP/keys"
          echo "$ASC_KEY_P8" | base64 --decode > "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
          chmod 600 "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"

      - run: xcodegen generate

      # 配布用プロファイルは secret に置かず、その場で API から取る。
      # 失効や証明書の入れ替えがあっても、ここが自動で追従する。
      - name: 配布用プロファイルを取る
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          cp "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" ~/.appstoreconnect/private_keys/
          make asc-venv
          make asc-profile

      - name: アーカイブ
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild archive \
            -project UsefulMap.xcodeproj -scheme UsefulMap \
            -destination 'generic/platform=iOS' \
            -archivePath build/UsefulMap.xcarchive \
            MARKETING_VERSION=${{ steps.version.outputs.marketing }} \
            CURRENT_PROJECT_VERSION=${{ steps.version.outputs.build }} \
            CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=YES \
            CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=X97ZJZ42VZ \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="Useful Map App Store"

      - name: .ipa を書き出す
        run: |
          xcodebuild -exportArchive \
            -archivePath build/UsefulMap.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist ExportOptions.plist

      - name: スクリーンショットを撮り直す
        run: make screenshots

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.version.outputs.marketing }}-${{ steps.version.outputs.build }}
          path: |
            build/export/UsefulMap.ipa
            artifacts/screenshots/final

      # ここから先が Apple へ送る操作。dry run では飛ばす。
      - name: 検証（Apple へは送らない）
        if: ${{ inputs.dry_run }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          export API_PRIVATE_KEYS_DIR="$RUNNER_TEMP/keys"
          xcrun altool --validate-app --type ios \
            --file build/export/UsefulMap.ipa \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: ビルドをアップロード
        if: ${{ !inputs.dry_run }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          export API_PRIVATE_KEYS_DIR="$RUNNER_TEMP/keys"
          xcrun altool --upload-app --type ios \
            --file build/export/UsefulMap.ipa \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: 説明文・キーワード・スクリーンショットを反映
        if: ${{ !inputs.dry_run }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          make asc-push
          make asc-screenshots
          # アップロードしただけではバージョンに付かないので、処理完了を待って紐付ける。
          make asc-build
