name: UsefulMap
options:
  bundleIdPrefix: com.usefulmap
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
    SWIFT_STRICT_CONCURRENCY: minimal

packages:
  UsefulMapKit:
    path: Packages/UsefulMapKit

targets:
  UsefulMap:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: UsefulMapKit
        product: Presentation
      - package: UsefulMapKit
        product: Infrastructure
      - package: UsefulMapKit
        product: Data
      - package: UsefulMapKit
        product: Domain
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Useful Map
        CFBundleDevelopmentRegion: ja
        # 対応言語。地域限定の言語しか話さない利用者を主な対象にしている。
        CFBundleLocalizations: [ja, en, zh-Hans, ko, th]
        # 現在地を出発地にするためだけに使う。専用 Backend へは送信しない。
        NSLocationWhenInUseUsageDescription: "現在地を出発地として経路を比較するために使用します。"
        # 標準の HTTPS 以外の暗号化は使用していない。
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UIStatusBarStyle: UIStatusBarStyleDefault
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.usefulmap.UsefulMap
        PRODUCT_NAME: UsefulMap
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "0.1.0"
        TARGETED_DEVICE_FAMILY: "1,2"
      configs:
        # 配布用の署名はここにだけ書く。コマンドラインで渡すと SPM の各
        # ターゲットにも掛かり、「プロビジョニングプロファイルに対応していない」
        # と言われて落ちる。アーカイブは Release なので、影響はここだけに閉じる。
        Release:
          CODE_SIGNING_REQUIRED: YES
          CODE_SIGNING_ALLOWED: YES
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "Useful Map App Store"
          DEVELOPMENT_TEAM: X97ZJZ42VZ

  UsefulMapUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/UITests
    dependencies:
      - target: UsefulMap
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.usefulmap.UsefulMapUITests

schemes:
  UsefulMap:
    build:
      targets:
        UsefulMap: all
        UsefulMapUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - UsefulMapUITests
