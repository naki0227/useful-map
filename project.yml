name: UsefulMap
options:
  bundleIdPrefix: com.usefulmap
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
    SWIFT_STRICT_CONCURRENCY: minimal

packages:
  UsefulMapKit:
    path: Packages/UsefulMapKit

targets:
  UsefulMap:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: UsefulMapKit
        product: Presentation
      - package: UsefulMapKit
        product: Infrastructure
      - package: UsefulMapKit
        product: Data
      - package: UsefulMapKit
        product: Domain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.usefulmap.UsefulMap
        PRODUCT_NAME: UsefulMap
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "0.1.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_CFBundleDisplayName: Useful Map
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "現在地を出発地として経路を比較するために使用します。"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleDefault

  UsefulMapUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/UITests
    dependencies:
      - target: UsefulMap
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.usefulmap.UsefulMapUITests

schemes:
  UsefulMap:
    build:
      targets:
        UsefulMap: all
        UsefulMapUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - UsefulMapUITests
