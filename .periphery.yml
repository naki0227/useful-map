# 未使用コード検出（https://github.com/peripheryapp/periphery）
project: UsefulMap.xcodeproj
schemes:
  - UsefulMap
# 3.x はインデックスにある全ファイル（SwiftPM の各モジュールを含む）を調べる。
# パッケージのテストはスキームに入れてあり、テストからの参照も「使われている」に数える。
exclude_tests: false

# SwiftUI / Codable / プロトコル準拠は動的に使われるため、既定の保守的な扱いを維持する。
retain_public: false
retain_objc_accessible: true
retain_assign_only_properties: true
skip_build: false
strict: true
# GitHub Actions 形式の出力に必要（3.x）。
relative_results: true

# UI テスト専用の注入コードは Release では未使用に見えるため除外する。
report_exclude:
  - "**/UITestConfiguration.swift"
  # contract-watch/format.json から生成する契約データ。形式の全項目を写すので、Swift 側で使わない値も含む。
  - "**/*+Generated.swift"
